name: Betadash Session Keepalive

on:
  schedule:
    - cron: '0 0 */7 * *'  # 每 7 天在 UTC 0:00 自动运行一次
  workflow_dispatch:        # 支持在 GitHub 界面手动点击触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行 Session 保鲜脚本
        env:
          PANEL_COOKIE: ${{ secrets.PANEL_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python auto_login.py
